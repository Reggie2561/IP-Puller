<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>IP Puller Made By Reggie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<meta name="theme-color" content="#0f172a">
<style>
body {
  font-family: 'Inter', system-ui, sans-serif;
  min-height: 100vh;
  background: linear-gradient(to bottom, #0f172a 0vh, #1e293b 100vh);
  color: white;
  margin: 0;
  padding: 0;
}
main {
  padding: 100px 20px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
}
@media (max-width: 600px) {
  main { padding: 70px 10px 10px; }
}

h2 {
  font-size: 1.25rem;
  letter-spacing: -0.02em;
  margin-bottom: 10px;
  color: #f1f5f9;
  position: relative;
}

.table-wrapper {
  width: 100%;
  overflow-x: auto;
}

table {
  border-collapse: collapse;
  width: 95%;
  background: #1e293b;
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 40px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
}
th, td {
  padding: 10px 14px;
  text-align: left;
  border-bottom: 1px solid #334155;
  color: white;
  line-height: 1.5;
}
th {
  background-color: #111827;
  color: #f8fafc;
}
tr {
  transition: background-color 0.3s ease, transform 0.2s ease;
}
tr:hover {
  background-color: #334155;
  transform: scale(1.01);
}
.status-dot {
  height: 10px;
  width: 10px;
  border-radius: 50%;
  display: inline-block;
  margin-right: 6px;
  vertical-align: middle;
}
.highlight-new {
  animation: fadeIn 1s ease;
  background-color: #22c55e44;
}
@keyframes fadeIn {
  from {background-color:#22c55e88;}
  to {background-color:transparent;}
}

/* === Yellow underline for NOT FOUND usernames === */
.username-not-found {
  text-decoration: underline;
  text-decoration-color: yellow;
  text-underline-offset: 2px;
}

/* === TOP BAR === */
.top-bar {
  position: fixed;
  top: 0; left: 0; right: 0;
  background: #111827;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 6px;
  padding: 6px 10px;
  z-index: 1000;
  box-shadow: 0 2px 6px rgba(0,0,0,0.3);
}

.scroll-container {
  flex: 1;
  overflow: hidden;
}
.scroll-content {
  display: inline-flex;
  white-space: nowrap;
  animation: scrollLoop 20s linear infinite;
}
.scroll-text {
  display: inline-block;
  padding-right: 50px;
}
#scrollTextClone { display: none; }

@keyframes scrollLoop {
  0% { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}

@media (max-width: 768px) {
  #scrollTextClone { display: inline-block; }
}
@media (min-width: 769px) {
  .scroll-content { animation: none; }
}

.top-bar-buttons {
  display: flex;
  gap: 6px;
  flex-shrink: 0;
}
@media (max-width: 500px) {
  .top-bar-buttons { flex-direction: column; width: 100%; }
  #barToggleBtn, #multiToolBtn { width: 100%; text-align: center; }
}
@media (max-width: 400px) {
  h2 { font-size: 1rem; }
  .scroll-text { font-size: 0.8rem; }
}

#barToggleBtn, #multiToolBtn, .bar-btn {
  padding: 6px 10px;
  border: 1px solid #3b82f6;
  border-radius: 5px;
  background: linear-gradient(135deg, #2563eb, #1d4ed8);
  color: white;
  cursor: pointer;
  font-weight: 600;
  font-size: 0.8rem;
  box-shadow: 0 2px 4px rgba(37,99,235,0.3);
  transition: all 0.2s ease;
}
#barToggleBtn:hover, #multiToolBtn:hover, .bar-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 8px rgba(37,99,235,0.4);
}

.field-btns {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px;
  margin-bottom: 15px;
}

.ip-text { transition: background-color 0.3s ease; }

@media screen and (max-width: 768px) {
  table, thead, tbody, th, td, tr { display: block; width: 100%; }
  thead tr { display: none; }
  tr { margin-bottom: 12px; background: #1e293b; border-radius: 8px; padding: 8px 12px; }
  td { display: block; padding: 4px 0; text-align: left; border: none; border-bottom: 1px solid #334155; }
  td::before { content: attr(data-label) ": "; font-weight: bold; color: #f8fafc; margin-right: 4px; }
  td span.ip-text, td span.username-text { text-decoration: underline; cursor: pointer; }
}
</style>
</head>
<body>

<div class="top-bar" id="topBar">
  <div class="scroll-container">
    <div class="scroll-content">
      <span class="scroll-text" id="scrollText">Loading...</span>
      <span class="scroll-text" id="scrollTextClone">Loading...</span>
    </div>
  </div>
  <div class="top-bar-buttons">
    <button id="multiToolBtn" onclick="openMultiTool()">MultiTool</button>
  </div>
</div>

<main>
<h2>Reggie's IP Puller</h2>
<div class="field-btns">
  {% for name in field_names %}
  <button class="bar-btn" onclick="toggleColumn({{ loop.index0 }})">Toggle {{ name }}</button>
  {% endfor %}
</div>

<div class="table-wrapper">
<table id="ipTable">
  <thead>
    <tr>
      {% for name in field_names %}
      <th>{{ name }}</th>
      {% endfor %}
    </tr>
  </thead>
  <tbody id="ipBody"></tbody>
</table>
</div>

<h2>Last 30 Left Players</h2>
<div class="table-wrapper">
<table id="leftTable">
  <thead>
    <tr>
      {% for name in left_field_names %}
      <th>{{ name }}</th>
      {% endfor %}
    </tr>
  </thead>
  <tbody id="leftBody"></tbody>
</table>
</div>
</main>

<script>
const field_names_js = {{ field_names|tojson }};
const left_field_names_js = {{ left_field_names|tojson }};
const hiddenCols = new Set();
const tbody = document.getElementById('ipBody');
const leftBody = document.getElementById('leftBody');
const scrollText = document.getElementById('scrollText');
const scrollTextClone = document.getElementById('scrollTextClone');
const topBar = document.getElementById('topBar');
let barVisible = true;

function toggleBar() {
  barVisible = !barVisible;
  topBar.style.transform = barVisible ? "translateY(0)" : "translateY(-100%)";
}
function openMultiTool() { window.open('/ReggiesMultiTool', '_blank'); }
function toggleColumn(index) {
  [document.getElementById('ipTable'), document.getElementById('leftTable')].forEach(table => {
    for (let row of table.rows) {
      if (row.cells[index]) row.cells[index].style.display = row.cells[index].style.display === 'none' ? '' : 'none';
    }
  });
  hiddenCols.has(index) ? hiddenCols.delete(index) : hiddenCols.add(index);
}

const statusColors = {"concurrent":"#ffffff","joined":"#22c55e","removed":"#7c3aed","disconnected":"#eab308","new_connection":"#3b82f6","left":"#ef4444"};
function createStatusDot(color){return `<span class="status-dot" style="background:${color}"></span>`;}
function updateTopBarText(html){scrollText.innerHTML=html;scrollTextClone.innerHTML=html;}

async function fetchData() {
  try {
    const res = await fetch('/update_ips',{method:'PUT'});
    const data = await res.json();
    const rows = data.rows;
    const stats = data.stats;

    const html =
      `${createStatusDot(statusColors.concurrent)} IP's: ${stats.concurrent} &nbsp; | &nbsp;` +
      `${createStatusDot(statusColors.joined)} In Lobby: ${stats.connected} &nbsp; | &nbsp;` +
      `${createStatusDot(statusColors.removed)} Disconnecting: ${stats.removed} &nbsp; | &nbsp;` +
      `${createStatusDot(statusColors.new_connection)} Just Joined: ${stats.new_connection} &nbsp; | &nbsp;` +
      `${createStatusDot(statusColors.left)} Left Players: ${stats.left_players}`;
    updateTopBarText(html);

    const priority = {"purple":0,"green":1,"blue":2,"red":3};
    rows.sort((a,b)=>priority[a.status]-priority[b.status]);
    tbody.innerHTML = '';
    rows.forEach(row => {
      const tr = document.createElement('tr');
      if(row.status==='blue') tr.classList.add('highlight-new');
      row.fields.forEach((f,idx)=>{
        const td = document.createElement('td');
        td.setAttribute('data-label', field_names_js[idx]);
        if(idx===0) td.innerHTML=`${createStatusDot(row.status)} <span class="ip-text">${f.value}</span>`;
        else if(idx===8) {
          const usernameClass = f.value === "NOT FOUND" ? "username-text username-not-found" : "username-text";
          td.innerHTML = `<span class="${usernameClass}" data-ip="${row.ip}">${f.value}</span>`;
        } else td.textContent = f.value;
        td.style.display = hiddenCols.has(idx) ? 'none' : '';
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
  } catch(err){ console.error(err);}
}

async function fetchLeftData() {
  try {
    const res = await fetch('/update_left_ips',{method:'PUT'});
    const data = await res.json();
    const rows = data.rows;
    leftBody.innerHTML = '';
    rows.forEach(row=>{
      const tr=document.createElement('tr');
      row.fields.forEach((f,idx)=>{
        const td=document.createElement('td');
        td.setAttribute('data-label', left_field_names_js[idx]);
        if(idx===0) td.innerHTML=`${createStatusDot(statusColors.left)} <span class="ip-text">${f.value}</span>`;
        else if(idx===6) {
          const usernameClass = f.value === "NOT FOUND" ? "username-text username-not-found" : "username-text";
          td.innerHTML = `<span class="${usernameClass}" data-ip="${row.ip}">${f.value}</span>`;
        } else td.textContent = f.value;
        td.style.display = hiddenCols.has(idx)?'none':'';
        tr.appendChild(td);
      });
      leftBody.appendChild(tr);
    });
  } catch(err){ console.error(err);}
}

function copyToClipboard(text) {
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).catch(console.error);
  else {
    const t=document.createElement('textarea');
    t.value=text; document.body.appendChild(t); t.select();
    try{document.execCommand("copy");}catch{} t.remove();
  }
}
function handleCellClick(e){
  const ipSpan = e.target.closest('.ip-text');
  if(ipSpan){ copyToClipboard(ipSpan.textContent.trim()); ipSpan.style.backgroundColor="#22c55e88"; setTimeout(()=>ipSpan.style.backgroundColor="",500);}
  const userSpan = e.target.closest('.username-text');
  if(userSpan){
    const ip=userSpan.dataset.ip;
    const username=prompt("Enter username for IP: "+ip);
    if(username) fetch('/save_username',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ip,username})})
      .then(()=>{userSpan.textContent=username; userSpan.classList.remove('username-not-found');})
      .catch(console.error);
  }
}
tbody.addEventListener('click', handleCellClick);
leftBody.addEventListener('click', handleCellClick);

setInterval(fetchData,1500);
setInterval(fetchLeftData,5000);
fetchData();
fetchLeftData();
</script>
</body>
</html>
